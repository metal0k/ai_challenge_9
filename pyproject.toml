[project]
name = "ai-challenge-9"
version = "0.1.0"
description = "Задания курса AI Advent 9 на Mistral API"
requires-python = ">=3.12"
dependencies = [
    # SDK v2: импорты идут из mistralai.client, не из mistralai
    "mistralai>=2,<3",
    "typer>=0.15",
    "rich>=13.9",
    "python-dotenv>=1.0",
    "httpx>=0.28",
    "obsws-python>=1.7",
    # только для проверки, что источник захвата не даёт чёрный кадр
    "pillow>=11",
]

[project.scripts]
advent = "advent_cli.app:main"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["advent_core", "advent_cli", "week_01"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# typer объявляет флаги через вызов в дефолте аргумента — это его штатный API,
# а не ошибка изменяемого дефолта, на которую рассчитан B008.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
